name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: worktree-gc
  HELPER_BIN_NAME: worktree-gc-ownership-helper

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive_ext: tgz
            binary_ext: ""
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive_ext: tgz
            binary_ext: ""
          - target: aarch64-apple-darwin
            os: macos-14
            archive_ext: tgz
            binary_ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive_ext: zip
            binary_ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches Cargo version
        id: version
        shell: bash
        run: |
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json, sys; print(next(package for package in json.load(sys.stdin)["packages"] if package["name"] == "worktree-gc")["version"])')"
          release_ref="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          tag_version="${release_ref#v}"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "Cargo.toml version $cargo_version does not match tag $release_ref" >&2
            exit 1
          fi
          echo "cargo_version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --locked --release --bin "${BIN_NAME}" --target ${{ matrix.target }}

      - name: Build macOS ownership helper
        if: runner.os == 'macOS'
        run: cargo build --locked --release --features privileged-macos-helper --bin "${HELPER_BIN_NAME}" --target ${{ matrix.target }}

      - name: Package release archive
        id: package
        shell: bash
        run: |
          package="${BIN_NAME}-${{ matrix.target }}-v${{ steps.version.outputs.cargo_version }}"
          staging="dist/${package}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.binary_ext }}" "$staging/"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp "target/${{ matrix.target }}/release/${HELPER_BIN_NAME}" "$staging/"
          fi
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            PACKAGE="$package" python - <<'PY'
          import os
          import zipfile

          package = os.environ["PACKAGE"]
          archive = f"{package}.zip"
          staging = os.path.join("dist", package)

          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zip_file:
              for filename in sorted(os.listdir(staging)):
                  source = os.path.join(staging, filename)
                  zip_file.write(source, f"{package}/{filename}")
          PY
          else
            COPYFILE_DISABLE=1 tar -C dist -czf "${package}.tgz" "$package"
          fi
          echo "archive=${package}.${{ matrix.archive_ext }}" >> "$GITHUB_OUTPUT"

      - name: Verify release archive contents
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PACKAGE: ${{ env.BIN_NAME }}-${{ matrix.target }}-v${{ steps.version.outputs.cargo_version }}
          MAIN_BINARY: ${{ env.BIN_NAME }}${{ matrix.binary_ext }}
          HELPER_BINARY: ${{ runner.os == 'macOS' && env.HELPER_BIN_NAME || '' }}
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile

          archive = os.environ["ARCHIVE"]
          package = os.environ["PACKAGE"]
          expected = {
              f"{package}/{os.environ['MAIN_BINARY']}",
          }
          if os.environ["HELPER_BINARY"]:
              expected.add(f"{package}/{os.environ['HELPER_BINARY']}")
          if archive.endswith(".zip"):
              with zipfile.ZipFile(archive) as release:
                  actual = set(release.namelist())
          else:
              with tarfile.open(archive) as release:
                  actual = {member.name for member in release.getmembers() if member.isfile()}
          if actual != expected:
              raise SystemExit(
                  f"release archive entries differ: expected {sorted(expected)}, got {sorted(actual)}"
              )
          PY

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: artifacts/*
