name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python for the embedded migration operator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test archived-child migration with isolated fixtures
        run: python3 -B -m unittest discover -s tests -p 'test_codex_migration.py'

      - name: Check formatting
        run: cargo fmt --check

      - name: Check lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  macos-ownership-helper:
    name: macOS ownership helper
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check helper and protocol
        run: cargo check --locked --all-targets --all-features

      - name: Run library tests
        run: cargo test --locked --lib --all-features

      - name: Check ownership lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
